name: Daily quote

on:
  schedule:
    - cron: "5 22 * * *"   # 22:05 UTC = 00:05 in Windhoek (UTC+2)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python generate_quote.py
      - name: Commit new image
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          git add assets/quote.png
          git diff --cached --quiet || git commit -m "Quote for $(date -u +%F)"
          git push
